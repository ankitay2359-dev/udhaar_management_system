<!DOCTYPE html>

<html>

<head>

```
<title>Login</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
```

</head>

<body>

<div class="login-box">

```
<h1>
    Udhaar Management System
</h1>

<h3>
    Admin Login
</h3>


{% if error %}

    <p style="color:red;">
        {{ error }}
    </p>

{% endif %}


<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <br>
    <br>


    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <br>
    <br>


    <button type="submit">
        Login
    </button>

</form>
```

</div>

</body>

</html>
