<!DOCTYPE html>

<html>

<head>

```
<title>Edit Udhaar</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
```

</head>

<body>

<header>

```
<h1>Edit Udhaar</h1>
```

</header>

<div class="container">

```
<form method="POST">


    <!-- PRODUCT NAME -->

    <label>
        Product Name
    </label>

    <br>

    <input
        type="text"
        name="product_name"
        value="{{ udhaar.product_name }}"
        required
    >

    <br>
    <br>


    <!-- QUANTITY -->

    <label>
        Quantity
    </label>

    <br>

    <input
        type="text"
        name="quantity"
        value="{{ udhaar.quantity }}"
        placeholder="Example: 5kg, 2 boxes, 3 packets"
        required
    >

    <br>
    <br>


    <!-- AMOUNT -->

    <label>
        Amount
    </label>

    <br>

    <input
        type="number"
        step="0.01"
        min="0"
        name="amount"
        value="{{ udhaar.amount }}"
        required
    >

    <br>
    <br>


    <!-- UDHAAR DATE -->

    <label>
        Udhaar Date
    </label>

    <br>

    <input
        type="date"
        name="udhaar_date"
        value="{{ udhaar.udhaar_date }}"
        required
    >

    <br>
    <br>


    <!-- DUE DATE -->

    <label>
        Due Date
    </label>

    <br>

    <input
        type="date"
        name="due_date"
        value="{{ udhaar.due_date or '' }}"
    >

    <br>
    <br>


    <!-- NOTES -->

    <label>
        Notes
    </label>

    <br>

    <textarea
        name="notes"
        rows="4"
        placeholder="Enter notes (optional)"
    >{{ udhaar.notes or '' }}</textarea>

    <br>
    <br>


    <!-- UPDATE BUTTON -->

    <button type="submit">
        Update Udhaar
    </button>


</form>


<br>


<a href="{{ url_for('udhaar') }}">
    ⬅ Back to Udhaar
</a>
```

</div>

</body>

</html>
